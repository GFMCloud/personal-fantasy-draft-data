[project]
name = "draft-data"
version = "0.1.0"
description = "League-agnostic fantasy football draft data layer"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "requests>=2.31",
    "rapidfuzz>=3.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
draft-data = "draft_data.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
